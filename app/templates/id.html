<!DOCTYPE html>

  Roster: Eviss Wu, Yu Lu, Kiran Soemardjo, Mustafa Abdullah

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLaDOS</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--steam-bg)]">

  <header class="bg-[url('{{ url_for('static', filename='images/colored_body_top.png') }}')] flex justify-center w-full backdrop-blur flex items-center justify-between px-24 pt-8 pb-5">
    <div id="title" class ="flex flex-col pl-8">
      <h1 class="text-2xl text-[var(--steam-b)] select-none flex flex-row mb-2">
      FLaDOS
        <div id="logo" class="ml-4 w-8 h-8">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Steam" class="w-20 h-auto">
        </div>
      </h1>
      <p class="text-sm indent-4 italic text-clamp-1 text-[var(--steam-g)] select-none">
        the Formatting, Loading, & Aggregation of Data for Observations of Steam
      </p>
    </div>
    <div id="navigation" class="flex pr-8">
      <p class="select-none text-[var(--steam-g)]">
        <a href="/steam_id"
          class="text-sm px-2 py-2 rounded-lg text-white hover:text-[var(--steam-b)] transition">
          Your Trends
        </a>
      </p>
    </div>

  </header>


  <main class="bg-[url('{{ url_for('static', filename='images/colored_body_main.jpg') }}')] bg-no-repeat bg-cover flex-1 px-20 py-10 bg-[var(--steam-bg2)]">

    <div class="flex flex-col mb-10">
      <h2 class="text-3xl text-[var(--steam-g)] mb-4">
        Input your Steam ID to see your trends
      </h2>
      <form action="/trends" method="GET">
        <input type="text" id="steam_id" name="steam_id" required>
        <br>
        <button type="submit" style="color: white;">Submit</button>
      </form>
      <p class="text-right text-lg text-[var(--steam-g)] max-w-2xl">
        Note that your account must be public in order for your information to be accessed. 
      </p>
    </div>

  </main>

  <footer class="mb-12 pr-6 pt-6 text-center text-sm text-gray-500">
    <p class = "select-none">
    <a href="/" class="hover:text-[var(--steam-b)] transition">
      ↑ Go to top
    </a>
    |
    <a href="https://github.com/kirans14/orangutans-p04" class="hover:text-[var(--steam-b)] transition">
    Made by Orangutans, SoftDev P04 | 
    </a>
    2026
    </p>

  </footer>

  <script src="{{ url_for('static', filename='js/homepage.js') }}"></script>
</body>
</html>
